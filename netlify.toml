[build]
command = "npm run build:client"
functions = "netlify/functions"
publish = "dist/spa"


[functions]
external_node_modules = ["express"]
node_bundler = "esbuild"
[[redirects]]
force = true
from = "/api/*"
status = 200
to = "/.netlify/functions/api/:splat"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# حزم الشيفرة تحمل بصمةً في اسمها (Vite): تُخزَّن في المتصفّح سنةً بلا إعادة
# تحقّق، فلا يُسأل الخادم عنها في كلّ فتحٍ للنظام. والصفحة الرئيسية (index.html)
# يُتحقَّق منها في كلّ فتح كما هي — فيصل كلّ نشرٍ جديد فورًا.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
